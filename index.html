<!doctype html>
<html lang="es">
<head>

<title>Caso Fastly</title>
<!--
  Trabajo final de Estadística · Ingeniería de Sistemas · Universidad Católica Luis Amigó
  Caso 4: Colapso de Fastly y el apagón de The New York Times / Reddit.
  Integrantes: Mariana Aguilar, Giany Salazar, Carlos Palacios, Marshall Robinson, Juan Manuel Restrepo.
  Archivo autocontenido: abrir directamente en el navegador (requiere internet solo para las librerías CDN).
  Librerías: Chart.js (gráficas) y KaTeX (fórmulas). Los datos de Caso4.xlsx van incrustados.

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

<style>
:root{
  color-scheme:dark;
  --bg:#0a0d13; --panel:#111620; --panel2:#161d2a; --line:#252e40; --line2:#334058;
  --text:#e8edf4; --muted:#93a0b4; --dim:#647086;
  --orange:#ff7a1a; --red:#ff3d4a; --amber:#ffc247; --green:#2fe0a0; --blue:#59c4ff; --violet:#a98bff;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 18px/1.55 Inter,system-ui,Segoe UI,Roboto,sans-serif;
  display:grid;grid-template-rows:auto 4px auto 1fr auto;height:100%;overflow:hidden;
  background-image:radial-gradient(1200px 500px at 85% -10%,rgba(255,90,30,.10),transparent 60%),
  linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:auto,32px 32px,32px 32px}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
code,.mono{font-family:var(--mono)}

/* ---------- Barra superior ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(10,13,19,.85);backdrop-filter:blur(6px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em;font-size:15px;text-transform:uppercase}
.brand .led{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.brand small{color:var(--muted);font-weight:500;letter-spacing:.02em;text-transform:none}
.spacer{flex:1}
.badge{font:500 13px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:15px;transition:.15s}
.btn:hover{border-color:var(--orange);color:#fff}
.btn.primary{background:linear-gradient(135deg,#ff7a1a,#ff3d4a);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.progress{background:var(--line)}
.progress .bar{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--red));transition:width .45s ease}
.dots{display:flex;gap:6px;padding:8px 18px;overflow-x:auto;border-bottom:1px solid var(--line)}
.dot{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.dot.on{border-color:var(--orange);color:#fff;background:rgba(255,122,26,.15)}
.dot.done{color:var(--text)}

/* ---------- Escenario ---------- */
main{overflow:auto;padding:22px clamp(16px,3vw,40px) 40px}
.scene{max-width:1400px;margin:0 auto;animation:sceneIn .5s ease}
@keyframes sceneIn{from{opacity:0;transform:translateY(12px)}}
.kicker{font:600 13px var(--mono);letter-spacing:.14em;color:var(--orange);text-transform:uppercase}
.scene h1{font-size:clamp(26px,3.2vw,40px);font-weight:800;margin:6px 0 8px}
.lead{color:var(--muted);max-width:980px;margin:0 0 18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);gap:20px;align-items:start}
.grid2.even{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.card h3{font-size:17px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.card h3 .tag{font:600 11px var(--mono);letter-spacing:.1em;color:var(--orange);border:1px solid rgba(255,122,26,.4);border-radius:6px;padding:2px 6px}
.meaning{border-left:4px solid var(--orange);background:linear-gradient(90deg,rgba(255,122,26,.08),var(--panel) 45%)}
.meaning p{margin:.3em 0}
.warn{border-left:4px solid var(--amber);background:linear-gradient(90deg,rgba(255,194,71,.10),var(--panel) 50%)}
.muted{color:var(--muted)}
.small{font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .l{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font:700 26px var(--mono);margin-top:2px}
.tile .x{font:400 12px var(--mono);color:var(--dim);margin-top:4px;word-break:break-all}
.ok{color:var(--green)} .bad{color:var(--red)} .hl{color:var(--orange)} .am{color:var(--amber)}
.pill{display:inline-block;font:600 13px var(--mono);padding:2px 9px;border-radius:999px;border:1px solid currentColor}
/* Puntos clave: listas cortas, una idea por línea */
ul.keys{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.keys li{position:relative;padding-left:20px;line-height:1.4}
ul.keys li::before{content:'';position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:2px;background:var(--orange)}
ul.keys li b{color:#fff}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.team span{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;font-size:15px}
.qa{display:grid;grid-template-columns:1fr;gap:10px}
.qa div{border-left:3px solid var(--line2);padding:2px 0 2px 12px}
.qa .q{font-weight:700;color:var(--amber);font-size:15px}
.qa .a{font-size:15px}
table.mtc td{white-space:normal;vertical-align:top}
table.mtc td.what{text-align:left;color:var(--muted);font-size:14px}
table.mtc td.read{text-align:left;font-size:14px}
/* Procedimiento paso a paso desplegable */
.proc-btn{display:inline-flex;align-items:center;gap:4px;margin-top:6px;background:rgba(255,122,26,.10);border:1px solid rgba(255,122,26,.45);border-radius:7px;color:var(--orange);font:600 12px Inter,sans-serif;padding:3px 8px;cursor:pointer;white-space:nowrap}
.proc-btn:hover{background:rgba(255,122,26,.22);color:#fff}
.proc-btn .car{transition:transform .2s;display:inline-block}
.proc-btn.on .car{transform:rotate(180deg)}
tr.proc{display:none}
tr.proc.on{display:table-row}
tr.proc>td{background:#0d121b;padding:12px 16px 14px;text-align:left;white-space:normal}
ol.psteps{margin:0;padding:0;list-style:none;counter-reset:ps;display:flex;flex-direction:column;gap:8px}
ol.psteps>li{counter-increment:ps;position:relative;padding:8px 10px 8px 40px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
ol.psteps>li::before{content:counter(ps);position:absolute;left:10px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--orange);color:#111;font:700 12px var(--mono);display:grid;place-items:center}
ol.psteps .pt{font-weight:700;font-size:14px;color:var(--amber)}
ol.psteps .pf{overflow-x:auto;overflow-y:hidden;font-size:15px}
ol.psteps .pr{font:600 14px var(--mono);color:var(--green);margin-top:2px}
ol.psteps .pn{font-size:13px;color:var(--muted)}

/* ---------- Panel ¿Cómo se hizo? ---------- */
details.how{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
details.how>summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;display:flex;align-items:center;gap:10px;user-select:none}
details.how>summary::-webkit-details-marker{display:none}
details.how>summary::before{content:'ƒ';font:700 16px var(--mono);color:#111;background:var(--orange);border-radius:6px;width:24px;height:24px;display:grid;place-items:center}
details.how>summary::after{content:'▸';margin-left:auto;color:var(--muted);transition:.2s}
details.how[open]>summary::after{transform:rotate(90deg)}
.how-body{padding:0 18px 16px;display:flex;flex-direction:column;gap:12px}
.hstep{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2)}
.hstep .t{font-size:14px;font-weight:700;color:var(--amber);margin-bottom:4px}
.hstep .f{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.hstep .r{font:600 15px var(--mono);color:var(--green);margin-top:4px}
.xl{display:flex;align-items:center;gap:8px;margin-top:6px;font:500 13px var(--mono);color:#b6f0c9;background:#0d1a14;border:1px solid #1f4a33;border-radius:8px;padding:5px 8px}
.xl b{color:#3ddc84;font-weight:700;font-size:11px;letter-spacing:.08em}
.xl span{flex:1;word-break:break-all}
.xl button{background:none;border:1px solid #1f4a33;border-radius:6px;color:#9fe3b9;font-size:11px;padding:2px 6px;cursor:pointer}
.katex{font-size:1.08em}
.katex-display{margin:.3em 0;overflow-x:auto;overflow-y:hidden;max-width:100%}

/* ---------- Tablas ---------- */
.tbl-wrap{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:#1a2232;font-weight:700;text-align:right;cursor:default;z-index:1}
th.sort{cursor:pointer}
th.sort:hover{color:var(--orange)}
td:first-child,th:first-child{text-align:left}
tbody tr:hover{background:rgba(255,255,255,.03)}
td.mono,th.mono{font-family:var(--mono)}
.chip-hit{color:var(--green);font-weight:700}.chip-miss{color:var(--red);font-weight:700}
input[type=search],select{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:15px;outline:none}
input[type=search]:focus,select:focus{border-color:var(--orange)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 12px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button.on{background:rgba(255,122,26,.18);color:#fff}

/* ---------- Animaciones de revelado ---------- */
.rv{opacity:0;animation:rv .55s ease forwards;animation-delay:var(--d,0s)}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
svg .rv{transform-box:fill-box}
.grow{transform-origin:left center;animation:grow .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s);transform:scaleX(0)}
@keyframes grow{to{transform:scaleX(1)}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
svg text{font-family:Inter,sans-serif}

/* ---------- Escenas específicas ---------- */
.canvas-wrap{position:relative;width:100%;}
.canvas-wrap canvas{display:block;width:100%;border-radius:12px;background:#080b11;border:1px solid var(--line)}
.alert-banner{display:flex;align-items:center;gap:10px;font:700 14px var(--mono);color:#fff;background:rgba(255,61,74,.15);border:1px solid rgba(255,61,74,.5);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.hyp{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline}
.hyp .h{font:700 18px var(--mono)}
.emp-row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;margin:10px 0;font-size:15px}
.emp-bar{position:relative;height:22px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.emp-bar .real{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--orange),var(--red));width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.emp-bar .theo{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;box-shadow:0 0 6px #fff}
.verdict{border-radius:var(--radius);padding:16px 18px;font-weight:700;font-size:19px;display:flex;gap:12px;align-items:center}
.verdict.yes{background:rgba(47,224,160,.10);border:1px solid rgba(47,224,160,.5);color:var(--green)}
.verdict.no{background:rgba(255,61,74,.10);border:1px solid rgba(255,61,74,.5);color:#ff8a92}
.verdict .ico{font-size:28px}
.steps{display:flex;flex-direction:column;gap:12px}
.step{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px;opacity:.12;transition:opacity .5s,border-color .5s;filter:grayscale(1)}
.step.on{opacity:1;filter:none}
.step.cur{border-color:var(--orange);box-shadow:0 0 0 1px rgba(255,122,26,.4),0 0 24px rgba(255,122,26,.12)}
.step>div{overflow-x:auto;overflow-y:hidden}
.step .n{font:700 12px var(--mono);color:var(--orange);letter-spacing:.12em}
.sticky{position:sticky;top:0}
.big-num{font:800 clamp(34px,4vw,54px) var(--mono);line-height:1}
.decision-tbl td,.decision-tbl th{text-align:center}
.decision-tbl td:first-child{text-align:left}
/* Sentencia */
.court{background:#f3ead7;color:#231a10;border-radius:6px;padding:clamp(18px,3vw,40px);font-family:Georgia,'Times New Roman',serif;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
.court h2{text-align:center;letter-spacing:.2em;font-size:clamp(20px,2.4vw,30px);margin-bottom:4px}
.court .sub{text-align:center;font-style:italic;color:#5c4a35;margin-bottom:16px}
.court .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center;margin:12px 0 18px}
.court .party{border:2px solid #2d2215;border-radius:6px;padding:10px;font-weight:700}
.court .party.win{background:#2d2215;color:#f3ead7}
.court ol{margin:6px 0 12px 0;padding-left:22px}
.court .resuelve{border-top:2px solid #2d2215;padding-top:12px;font-size:1.05em}
.stamp-row{display:flex;justify-content:flex-end;margin-top:18px}
.stamp{display:inline-block;transform:rotate(-8deg) scale(3);opacity:0;border:6px double;border-radius:10px;padding:8px 18px;font:900 clamp(22px,3vw,40px) Inter,sans-serif;letter-spacing:.1em;animation:stamp .5s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:1.6s;pointer-events:none;text-align:center;line-height:1.1}
.stamp small{display:block;font-size:.4em;letter-spacing:.05em}
.stamp.red{color:#c4161c;border-color:#c4161c}
.stamp.green{color:#0f7a43;border-color:#0f7a43}
@keyframes stamp{to{opacity:.9;transform:rotate(-8deg) scale(1)}}
.err-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.err{border-radius:12px;padding:16px;border:1px solid var(--line);background:var(--panel)}
.err h3{font-size:18px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--orange);border-radius:12px;padding:10px 16px;font-size:15px;opacity:0;transition:.35s;z-index:60;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{border-color:var(--red)}
/* Navegación inferior */
.navbar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line);background:rgba(10,13,19,.9)}
.navbar .where{flex:1;text-align:center;color:var(--muted);font-size:15px}
.navbar .where b{color:var(--text)}
.kbd{font:600 12px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.chart-box{position:relative;height:340px}
.chart-box.sm{height:280px}
@media (max-width:1000px){
  .grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}
  .err-grid{grid-template-columns:1fr}
  body{font-size:17px}
  .sticky{position:static}
}
@media (max-width:600px){
  .brand small,.badge{display:none}
  .navbar .where .kbdh{display:none}
  .court .vs{grid-template-columns:1fr}
  .emp-row{grid-template-columns:44px 1fr auto}
  th,td{white-space:normal;padding:6px}
}
</style>
</head>

<script>
/* =====================================================================
   1. MOTOR ESTADÍSTICO
   Todas las funciones replican las de Excel (nombres en español entre
   paréntesis) para que los resultados coincidan con el archivo de la
   estudiante.
   ===================================================================== */
// ==STATS-BEGIN==
const Stats = (() => {
  /** Φ(z): función de distribución normal estándar acumulada
   *  (DISTR.NORM.ESTAND.N(z;VERDADERO)). Algoritmo 5666 de Hart (1968)
   *  según G. West (2005); precisión ~1e-14, muy por encima de 4 decimales. */
  function normCdf(x) {
    const ax = Math.abs(x);
    let c;
    if (ax > 37) c = 0;
    else {
      const e = Math.exp(-ax * ax / 2);
      if (ax < 7.07106781186547) {
        let b = 3.52624965998911e-02 * ax + 0.700383064443688;
        b = b * ax + 6.37396220353165;
        b = b * ax + 33.912866078383;
        b = b * ax + 112.079291497871;
        b = b * ax + 221.213596169931;
        b = b * ax + 220.206867912376;
        c = e * b;

    const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
    const d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00];
    const pl = 0.02425;
    let q, r, x;
    if (p < pl) {
      q = Math.sqrt(-2 * Math.log(p));
      x = (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
    } else if (p <= 1 - pl) {
      q = p - 0.5; r = q * q;
      x = (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
    } else {
      q = Math.sqrt(-2 * Math.log(1 - p));
      x = -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) / ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
    }

  }

  const sum = a => a.reduce((s, v) => s + v, 0);
  const mean = a => sum(a) / a.length;                       // PROMEDIO
  const sorted = a => [...a].sort((x, y) => x - y);

    const s = sorted(a), n = s.length;
    return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;

})();

<script>
/* =====================================================================
   2. LECTURA Y DETECCIÓN DEL FORMATO DE LOS DATOS
   ===================================================================== */
const P0 = 0.85;                  // tasa contractual de aciertos
const Z95 = 1.96, Z99 = 2.576;    // valores de tabla para los IC
let groupSize = 5;                // tamaño de lote cuando hay una fila por petición
let DATA = null;                  // conjunto de datos detectado
let R = null;                     // resultados de todos los cálculos

/** Convierte un valor de celda a número (acepta coma decimal y "%"). */
function toNum(v) {
  if (v === null || v === undefined || v === '') return NaN;
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v ? 1 : 0;
  let s = String(v).trim().replace('%', '');
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(',', '.');
  return s === '' ? NaN : Number(s);
}
/** Convierte un valor a 1 (hit) / 0 (miss) / null si no es binario. */
function toBin(v) {
  if (v === 0 || v === 1) return v;
  if (v === true) return 1; if (v === false) return 0;
  const s = String(v ?? '').trim().toLowerCase();
  if (['1', 'hit', 'acierto', 'true', 'verdadero', 'si', 'sí', 'yes'].includes(s)) return 1;
  if (['0', 'miss', 'fallo', 'false', 'falso', 'no'].includes(s)) return 0;
  return null;
}
/** Letra de columna de Excel a partir del índice (0 → A). */
function colLetter(i) { let s = ''; i++; while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; }

/** Analiza cada columna: numérica, binaria, identificador, valores únicos. */
function profileColumns(cols, rows) {
  return cols.map((name, idx) => {
    const raw = rows.map(r => r[name]);
    const present = raw.filter(v => v !== null && v !== undefined && v !== '');
    const nums = raw.map(toNum);
    const nOk = nums.filter(Number.isFinite).length;
    const bins = raw.map(toBin);
    const bOk = bins.filter(v => v !== null).length;
    const numeric = present.length > 0 && nOk >= 0.9 * present.length;
    const uniq = new Set(present.map(String)).size;
    const finite = nums.filter(Number.isFinite);
    const max = finite.length ? Math.max(...finite) : NaN;
    // Identificador: por nombre, o enteros consecutivos 1, 2, 3, … (no confundir con conteos crecientes)
    const consecutive = numeric && finite.length > 2 && finite.every((v, i) => i === 0 || v === finite[i - 1] + 1);
    const isId = /(^id$|_id$|^id_|\bid\b|^n[º°o]?\.?$|^#$|^fila$|^num)/i.test(name) || consecutive;
    return { name, idx, letter: colLetter(idx), raw, nums, bins, numeric, binary: present.length > 0 && bOk >= 0.98 * present.length && uniq <= 2, uniq, max, isId };
  });
}

/** Detecta el formato del archivo y construye el conjunto de datos. */
function buildDataset(rows, cols, meta) {
  if (!rows.length) throw new Error('La hoja no tiene filas de datos.');
  const info = profileColumns(cols, rows);
  const D = { ...meta, rows, cols, info, mode: null };
  const bin = info.filter(c => c.binary && !c.isId);
  if (bin.length) {
    // --- Una fila por petición (hit = 1 / miss = 0) ---
    D.mode = 'requests';
    D.hitCol = bin.find(c => /hit|acierto|cach/i.test(c.name)) || bin[0];
    D.seq = D.hitCol.bins.filter(v => v !== null);
    D.groupCol = info.find(c => c !== D.hitCol && !c.isId &&
      /min|server|servidor|nodo|pop|interval|hora|time|fecha|lote|grupo|bloque|region/i.test(c.name) &&
      c.uniq >= 2 && c.uniq <= rows.length / 3) || null;
  } else {
    const reqCol = info.find(c => c.numeric && !c.isId && /petici|request|solicit|total|req/i.test(c.name) && !/hit|acierto|tasa|rate|ratio|%/i.test(c.name));
    const hitsCol = info.find(c => c.numeric && c !== reqCol && /hit|acierto/i.test(c.name) && !/tasa|rate|ratio|%|porc/i.test(c.name) && c.max > 1);
    if (reqCol && hitsCol) {
      // --- Una fila por intervalo/servidor con peticiones y hits ---
      D.mode = 'intervals'; D.reqCol = reqCol; D.hitsCol = hitsCol;
    } else {
      // --- Una fila por intervalo con la tasa de aciertos ---
      const rc = info.find(c => c.numeric && !c.isId && /tasa|rate|ratio|hit|acierto|porc|%/i.test(c.name)) || info.find(c => c.numeric && !c.isId);
      if (!rc) throw new Error('No encontré una columna numérica con hits, peticiones o tasa de aciertos.');
      D.mode = 'rates'; D.rateCol = rc; D.scale = rc.max > 1.5 ? 100 : 1;
    }
  }
  D.labelCol = info.find(c => c !== D.hitCol && c !== D.reqCol && c !== D.hitsCol && c !== D.rateCol && c !== D.groupCol) || null;
  return D;
}

/** Conjunto de datos incrustado (Caso4.xlsx). */
function embeddedDataset() {
  const cols = EMBEDDED.cols;
  const rows = EMBEDDED.rows.map(r => Object.fromEntries(cols.map((c, i) => [c, r[i]])));
  return buildDataset(rows, cols, { file: 'Caso4.xlsx', sheet: EMBEDDED.sheet, sheets: [EMBEDDED.sheet] });
}

/* =====================================================================
   3. CÁLCULO DE TODOS LOS RESULTADOS
   ===================================================================== */
function compute(D) {
  const S = Stats;
  const nRows = D.rows.length;
  // ---- 3.1 Variable continua: tasa de aciertos por grupo ----
  let groups = [];
  if (D.mode === 'requests') {
    const seq = D.seq;
    if (D.groupCol) {
      const map = new Map();
      D.rows.forEach((r, i) => {
        const b = D.hitCol.bins[i]; if (b === null) return;
        const k = String(r[D.groupCol.name]);
        if (!map.has(k)) map.set(k, { label: k, req: 0, hits: 0 });
        const g = map.get(k); g.req++; g.hits += b;
      });
      groups = [...map.values()];
    } else {
      for (let i = 0; i < seq.length; i += groupSize) {
        const part = seq.slice(i, i + groupSize);
        groups.push({ label: `Lote ${groups.length + 1} (${i + 1}–${i + part.length})`, req: part.length, hits: S.sum(part) });
      }
    }
    groups.forEach(g => g.rate = g.hits / g.req);
  } else if (D.mode === 'intervals') {
    D.rows.forEach((r, i) => {
      const req = D.reqCol.nums[i], hits = D.hitsCol.nums[i];
      if (Number.isFinite(req) && Number.isFinite(hits) && req > 0)
        groups.push({ label: D.labelCol ? String(r[D.labelCol.name]) : `Fila ${i + 2}`, req, hits, rate: hits / req });
    });
  } else {
    D.rows.forEach((r, i) => {
      const v = D.rateCol.nums[i];
      if (Number.isFinite(v)) groups.push({ label: D.labelCol ? String(r[D.labelCol.name]) : `Fila ${i + 2}`, rate: v / D.scale });
    });
  }
  const x = groups.map(g => g.rate), m = x.length;
  if (m < 2) throw new Error('Se necesitan al menos 2 grupos/intervalos para los cálculos.');

  // ---- 3.2 Medidas de tendencia central y dispersión ----
  const mean = S.mean(x), sd = S.sdS(x), mn = Math.min(...x), mx = Math.max(...x);
  const mode = S.modeExcel(x);
  const desc = {
    m, mean, median: S.median(x), mode, min: mn, max: mx, range: mx - mn,
    var: S.varS(x), sd, cv: sd / mean,
    q1: S.quantileInc(x, .25), q2: S.quantileInc(x, .5), q3: S.quantileInc(x, .75),
    p95: S.quantileInc(x, .95), p99: S.quantileInc(x, .99),
    sum: S.sum(x)
  };
  desc.iqr = desc.q3 - desc.q1;
  // Coeficiente de asimetría de Pearson: Sk = 3(x̄ − Me)/s  (0 = simétrica)
  desc.skew = sd > 0 ? 3 * (mean - desc.median) / sd : 0;

  // ---- 3.3 Tabla de frecuencias (regla de Sturges) ----
  const kRaw = 1 + 3.322 * Math.log10(m);
  let k = Math.max(1, Math.min(30, Math.ceil(kRaw)));
  let w = desc.range / k;
  if (desc.range === 0) { k = 1; w = 1; }
  const classes = Array.from({ length: k }, (_, j) => ({ li: mn + j * w, ls: mn + (j + 1) * w, f: 0 }));
  if (desc.range === 0) { classes[0].li = mn - .005; classes[0].ls = mn + .005; }
  x.forEach(v => { const j = desc.range === 0 ? 0 : Math.min(k - 1, Math.floor((v - mn) / w + 1e-9)); classes[j].f++; });
  let F = 0;
  classes.forEach(c => { c.mark = (c.li + c.ls) / 2; c.fr = c.f / m; F += c.f; c.F = F; c.Fr = F / m; });
  const modal = classes.reduce((b, c) => c.f > b.f ? c : b, classes[0]);
  const hist = { kRaw, k, w: desc.range === 0 ? 0 : w, classes, modal };

  // ---- 3.4 Normalidad ----
  const emp = [1, 2, 3].map(kk => {
    const lo = mean - kk * sd, hi = mean + kk * sd;
    const c = x.filter(v => v >= lo - 1e-12 && v <= hi + 1e-12).length;
    // Tolerancia aceptada frente al valor teórico: 10, 5 y 3 puntos porcentuales
    const expected = [0.683, 0.954, 0.997][kk - 1], tol = [0.10, 0.05, 0.03][kk - 1];
    return { k: kk, lo, hi, count: c, pct: c / m, expected, tol, ok: Math.abs(c / m - expected) <= tol };
  });
  const empOk = emp.every(e => e.ok);
  // Simetría (propiedad de la normal): media, mediana y moda deben casi coincidir.
  // Se acepta una diferencia de hasta un cuarto de desviación estándar.
  const center = mode.value !== null ? mode.value : modal.mark;    // moda o marca de la clase modal
  const symTol = 0.25 * sd;
  const sym = { median: desc.median, mode: center, modeIsClass: mode.value === null, tol: symTol,
    dMedian: Math.abs(mean - desc.median), dMode: Math.abs(mean - center) };
  sym.ok = sym.dMedian <= symTol && sym.dMode <= symTol;
  // Asimetría de Pearson: se acepta |Sk| < 0.5 como aproximadamente simétrica
  const skewOk = Math.abs(desc.skew) < 0.5;
  // Percentiles: en una normal P95 = x̄ + 1.645·s y P99 = x̄ + 2.326·s
  const pctl = [{ q: 95, z: 1.645, obs: desc.p95 }, { q: 99, z: 2.326, obs: desc.p99 }].map(p => {
    const exp = mean + p.z * sd;
    return { ...p, exp, ok: Math.abs(p.obs - exp) <= symTol };
  });
  const pctlOk = pctl.every(p => p.ok);
  const shapeOk = mode.distinct > 3;
  const isNormal = sym.ok && empOk && skewOk && pctlOk && shapeOk;
  const norm = { emp, empOk, sym, skewOk, pctl, pctlOk, shapeOk, isNormal, distinct: mode.distinct };

  // ---- 3.5 Proporción muestral ----
  let prop, propAlt = null;
  if (D.mode === 'requests') {
    const n = D.seq.length, hits = S.sum(D.seq);
    prop = { n, hits, phat: hits / n, label: 'n = número de peticiones' };
  } else if (D.mode === 'intervals') {
    const n = S.sum(groups.map(g => g.req)), hits = S.sum(groups.map(g => g.hits));
    prop = { n, hits, phat: hits / n, label: 'n = Σ peticiones' };
    propAlt = { n: m, hits: null, phat: hits / n, label: 'n = número de intervalos' };
  } else {
    prop = { n: m, hits: null, phat: mean, label: 'n = número de intervalos (solo hay tasas)' };
  }
  const testFor = pr => {
    const se0 = Math.sqrt(P0 * (1 - P0) / pr.n);
    const z = (pr.phat - P0) / se0;
    const pval = S.normCdf(z);
    return { se0, z, pval, reject05: pval < 0.05, reject01: pval < 0.01, np0: pr.n * P0, nq0: pr.n * (1 - P0) };
  };
  const test = testFor(prop);
  test.zc05 = S.normInv(0.05); test.zc01 = S.normInv(0.01);
  test.condOk = test.np0 >= 5 && test.nq0 >= 5;
  const testAlt = propAlt ? testFor(propAlt) : null;

  // ---- 3.6 Intervalos de confianza ----
  const seMean = sd / Math.sqrt(m);
  const seProp = Math.sqrt(prop.phat * (1 - prop.phat) / prop.n);
  const ci = {
    seMean, seProp,
    mean: [Z95, Z99].map(z => ({ z, me: z * seMean, lo: mean - z * seMean, hi: mean + z * seMean })),
    prop: [Z95, Z99].map(z => ({ z, me: z * seProp, lo: prop.phat - z * seProp, hi: prop.phat + z * seProp }))
  };
  if (propAlt) {
    const se = Math.sqrt(propAlt.phat * (1 - propAlt.phat) / propAlt.n);
    ci.propAlt = [Z95, Z99].map(z => ({ z, me: z * se, lo: propAlt.phat - z * se, hi: propAlt.phat + z * se }));
  }

  // ---- 3.7 Binomial: X = número de hits ~ B(n, p0) ----
  let binom = null;
  if (prop.hits !== null && Number.isInteger(prop.hits)) {
    const mu = prop.n * P0, sigma = Math.sqrt(prop.n * P0 * (1 - P0));
    binom = { mu, sigma, x: prop.hits, z: (prop.hits - mu) / sigma };
  }

  // ---- 3.8 Periodicidad (patrón sospechoso en los misses) ----
  let periodic = null;
  if (D.mode === 'requests') {
    const zeros = []; D.seq.forEach((v, i) => { if (v === 0) zeros.push(i + 1); });
    const gaps = zeros.slice(1).map((v, i) => v - zeros[i]);
    if (zeros.length >= 5 && gaps.every(g => g === gaps[0])) periodic = { gap: gaps[0], first: zeros[0], last: zeros[zeros.length - 1], count: zeros.length };
  }

  // ---- 3.9 Referencias de Excel para verificar cada cálculo ----
  const E = excelRefs(D, m, nRows);
  return { D, groups, x, desc, hist, norm, prop, propAlt, test, testAlt, ci, binom, periodic, E };
}

/** Construye las fórmulas de Excel (en español, separador ";" y coma decimal)
 *  equivalentes a cada cálculo, con los rangos reales del archivo. */
function excelRefs(D, m, nRows) {
  const last = nRows + 1, E = {};
  const aux = colLetter(D.cols.length + 1);         // columna auxiliar (deja una vacía)
  const aux2 = colLetter(D.cols.length + 2);
  if (D.mode === 'requests') {
    const c = D.hitCol.letter, rg = `${c}2:${c}${last}`;
    E.bin = rg; E.nExpr = `CONTAR(${rg})`; E.hitsExpr = `SUMA(${rg})`; E.phatExpr = `PROMEDIO(${rg})`;
    if (D.groupCol) {
      const g = D.groupCol.letter;
      E.rate = `${aux2}2:${aux2}${m + 1}`;
      E.howRate = `En ${aux}2 lista los grupos (=UNICOS(${g}2:${g}${last})) y en ${aux2}2 escribe =PROMEDIO.SI($${g}$2:$${g}$${last};${aux}2;$${c}$2:$${c}$${last}); arrástrala hasta ${aux2}${m + 1}.`;
    } else {
      E.rate = `${aux}2:${aux}${m + 1}`;
      E.howRate = `En ${aux}2 escribe =PROMEDIO(DESREF($${c}$2;(FILA()-2)*${groupSize};0;${groupSize};1)) y arrástrala hasta ${aux}${m + 1}. Cada celda es la tasa de un lote de ${groupSize} peticiones.`;
    }
  } else if (D.mode === 'intervals') {
    const rq = `${D.reqCol.letter}2:${D.reqCol.letter}${last}`, ht = `${D.hitsCol.letter}2:${D.hitsCol.letter}${last}`;
    E.nExpr = `SUMA(${rq})`; E.hitsExpr = `SUMA(${ht})`; E.phatExpr = `SUMA(${ht})/SUMA(${rq})`;
    E.rate = `${aux}2:${aux}${last}`;
    E.howRate = `En ${aux}2 escribe =${D.hitsCol.letter}2/${D.reqCol.letter}2 y arrástrala hasta ${aux}${last} (tasa de cada intervalo).`;
  } else {
    const c = D.rateCol.letter;
    E.rate = `${c}2:${c}${last}`; E.nExpr = `CONTAR(${E.rate})`; E.phatExpr = `PROMEDIO(${E.rate})` + (D.scale === 100 ? '/100' : '');
    E.howRate = D.scale === 100 ? `La columna ${c} está en porcentaje: divide entre 100 (por ejemplo en una columna auxiliar =${c}2/100).` : `La tasa ya está en la columna ${c}.`;
  }
  return E;
}

/* =====================================================================
   4. UTILIDADES DE PRESENTACIÓN
   ===================================================================== */
const T = String.raw;                                         // para escribir LaTeX sin escapar
const $ = (s, el = document) => el.querySelector(s);
const fmt = (v, d = 4) => Number.isFinite(v) ? v.toFixed(d) : '—';
const pct = (v, d = 1) => Number.isFinite(v) ? (v * 100).toFixed(d) + ' %' : '—';
const xl = (v, d = 4) => Number.isFinite(v) ? v.toFixed(d).replace('.', ',') : '';   // número con coma decimal para Excel
const int = v => Number(v).toLocaleString('es-CO');
/** Valor p legible: decimal y, si es muy pequeño, notación científica. */
const fmtP = p => !Number.isFinite(p) ? '—' : p < 0.0001 ? `${p.toExponential(2).replace('e-', ' × 10⁻').replace(/⁻(\d+)/, (_, e) => '⁻' + [...e].map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[c]).join(''))}` : p.toFixed(4);
const texP = p => p < 0.0001 ? (() => { const [mnt, ex] = p.toExponential(2).split('e'); return `${mnt}\\times10^{${+ex}}`; })() : p.toFixed(4);
function tex(s, display = false) {
  try { return katex.renderToString(s, { displayMode: display, throwOnError: false }); }
  catch (e) { return `<code>${s}</code>`; }
}
/** Panel "¿Cómo se hizo?": cada paso muestra fórmula, valores sustituidos,
 *  resultado y la fórmula de Excel equivalente. */
function how(steps, open = false, title = '¿Cómo se hizo?') {
  return ''; // Paneles retirados de la presentación: el detalle está en los botones "Paso a paso"
  return `<details class="how"${open ? ' open' : ''}><summary>${title}</summary><div class="how-body">
    <div class="muted small">Fórmulas de Excel en español con separador <code>;</code> y coma decimal. Si tu Excel está en inglés usa <code>,</code> como separador y punto decimal.</div>
    ${steps.map(s => `<div class="hstep">
      ${s.t ? `<div class="t">${s.t}</div>` : ''}
      ${s.f ? `<div class="f">${tex(s.f, true)}</div>` : ''}
      ${s.s ? `<div class="f">${tex(s.s, true)}</div>` : ''}
      ${s.r ? `<div class="r">${s.r}</div>` : ''}
      ${s.note ? `<div class="muted small">${s.note}</div>` : ''}
      ${s.xl ? xlChip(s.xl) : ''}
    </div>`).join('')}
  </div></details>`;
}
function xlChip(f) {
  const esc = f.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  return `<div class="xl"><b>EXCEL</b><span>${esc}</span><button data-copy="${esc}">copiar</button></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (b) { navigator.clipboard?.writeText(b.dataset.copy)?.catch(() => {}); b.textContent = '✓'; setTimeout(() => b.textContent = 'copiar', 1200); }
});
// Botones "Paso a paso": muestran u ocultan la fila con el procedimiento
document.addEventListener('click', e => {
  const b = e.target.closest('[data-proc]');
  if (!b) return;
  const row = document.getElementById(b.dataset.proc);
  if (row) { row.classList.toggle('on'); b.classList.toggle('on', row.classList.contains('on')); }
});
/** Une una lista en español: 'a, b y c'. */
const joinY = (arr, w = 'y') => arr.length < 2 ? arr.join('') : arr.slice(0, -1).join(', ') + ` ${w} ` + arr[arr.length - 1];
const procBtn = id => `<br><button class="proc-btn" data-proc="${id}">Paso a paso <span class="car">▾</span></button>`;
/** Lista numerada de pasos: {t: título, f: LaTeX, r: resultado, n: nota, xl: fórmula Excel}. */
function procHTML(steps) {
  return `<ol class="psteps">${steps.map(st => `<li>
    ${st.t ? `<div class="pt">${st.t}</div>` : ''}

function toast(msg, err = false) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', 3800);
}

/* ---- Registro de recursos de cada escena (se liberan al cambiar) ---- */
const Life = {
  items: [],
  timeout(fn, ms) { const id = setTimeout(fn, ms); this.items.push(() => clearTimeout(id)); return id; },
  interval(fn, ms) { const id = setInterval(fn, ms); this.items.push(() => clearInterval(id)); return id; },
  raf(fn) { let id, alive = true; const loop = t => { if (!alive) return; fn(t); id = requestAnimationFrame(loop); }; id = requestAnimationFrame(loop); this.items.push(() => { alive = false; cancelAnimationFrame(id); }); },
  chart(c) { this.items.push(() => c.destroy()); return c; },
  on(el, ev, fn) { el.addEventListener(ev, fn); this.items.push(() => el.removeEventListener(ev, fn)); },
  clear() { this.items.forEach(f => f()); this.items = []; }
};
/** Animación de 0→1 con easing durante ms milisegundos. */
function tween(ms, fn, delay = 0) {
  const start = performance.now() + delay;
  Life.raf(t => {
    const k = Math.min(1, Math.max(0, (t - start) / ms));
    fn(1 - Math.pow(1 - k, 3));
  });
}
/* Tema de Chart.js */
function chartTheme() {
  Chart.defaults.color = '#c9d2de';
  Chart.defaults.borderColor = 'rgba(255,255,255,.07)';
  Chart.defaults.font.family = 'Inter, sans-serif';
  Chart.defaults.font.size = 14;
}

/** Curva normal estándar en SVG con región de rechazo y área del valor p. */
function normalCurveSVG({ z, alphas = [0.05, 0.01], W = 680, H = 300, showP = true, mainAlpha = 0.05 }) {
  const x0 = -4.5, x1 = 4.5, pad = { l: 16, r: 16, t: 26, b: 48 };
  const sx = v => pad.l + (v - x0) / (x1 - x0) * (W - pad.l - pad.r);
  const sy = v => H - pad.b - v / 0.42 * (H - pad.t - pad.b);
  const area = (a, b) => {
    a = Math.max(a, x0); b = Math.min(b, x1); if (b <= a) return '';
    let d = `M${sx(a)},${sy(0)}`;
    for (let v = a; v <= b + 1e-9; v += 0.03) d += `L${sx(v)},${sy(Stats.normPdf(v))}`;
    return d + `L${sx(b)},${sy(Stats.normPdf(b))}L${sx(b)},${sy(0)}Z`;
  };
  let curve = ''; for (let v = x0; v <= x1 + 1e-9; v += 0.03) curve += (curve ? 'L' : 'M') + `${sx(v)},${sy(Stats.normPdf(v))}`;
  const colors = { 0.05: '#ff7a1a', 0.01: '#ff3d4a' };
  let g = '';
  // Regiones de rechazo
  alphas.forEach(a => {
    const zc = Stats.normInv(a), col = colors[a] || (a === mainAlpha ? '#ff7a1a' : '#ff3d4a');
    g += `<path d="${area(x0, zc)}" fill="${col}" opacity="${a === mainAlpha ? .35 : .25}"/>`;
  });
  // Área del valor p
  if (showP && Number.isFinite(z)) g += `<path d="${area(x0, z)}" fill="url(#hatch)" />`;
  g += `<path d="${curve}" fill="none" stroke="#e8edf4" stroke-width="2.5"/>`;
  g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${sy(0)}" y2="${sy(0)}" stroke="#334058"/>`;
  for (let t = -4; t <= 4; t++) g += `<line x1="${sx(t)}" x2="${sx(t)}" y1="${sy(0)}" y2="${sy(0) + 6}" stroke="#647086"/><text x="${sx(t)}" y="${sy(0) + 22}" fill="#93a0b4" font-size="14" text-anchor="middle">${t}</text>`;
  g += `<text x="${W - pad.r}" y="${H - 6}" fill="#647086" font-size="13" text-anchor="end">z</text>`;
  // Valores críticos
  alphas.forEach((a, i) => {
    // Etiquetas a la izquierda de la línea (cola izquierda); la de α mayor va arriba
    // para que ninguna línea punteada cruce el texto de la otra.
    const zc = Stats.normInv(a), col = colors[a] || '#ff7a1a', y = pad.t + 4 + i * 40;
    g += `<line x1="${sx(zc)}" x2="${sx(zc)}" y1="${sy(0)}" y2="${y - 10}" stroke="${col}" stroke-dasharray="5 4" stroke-width="2"/>
          <text x="${sx(zc) - 6}" y="${y + 4}" fill="${col}" font-size="14" font-weight="700" text-anchor="end">α = ${a} → z꜀ = ${zc.toFixed(3)}</text>`;
  });
  // Estadístico observado
  if (Number.isFinite(z)) {
    const zc = Math.max(x0 + 0.05, Math.min(x1 - 0.05, z)), off = z < x0 || z > x1;
    const lx = sx(zc), ly = sy(Stats.normPdf(zc));
    const anchor = zc < -2 ? 'start' : zc > 2 ? 'end' : 'middle';
    g += `<line x1="${lx}" x2="${lx}" y1="${sy(0)}" y2="${Math.min(ly, sy(0) - 70)}" stroke="#59c4ff" stroke-width="3"/>
          <circle cx="${lx}" cy="${sy(0)}" r="7" fill="#59c4ff"/>
          <text x="${lx + (anchor === 'start' ? 8 : anchor === 'end' ? -8 : 0)}" y="${Math.min(ly, sy(0) - 70) - 8}" fill="#59c4ff" font-size="16" font-weight="800" text-anchor="${anchor}">${off ? (z < 0 ? '◄ ' : '') : ''}z = ${z.toFixed(4)}${off && z > 0 ? ' ►' : ''}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Curva normal estándar">
    <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#59c4ff" stroke-width="2.4"/></pattern></defs>${g}</svg>`;
}
</script>

<script>
/* =====================================================================

const TEAM = ['Mariana Aguilar', 'Giany Salazar', 'Carlos Palacios', 'Marshall Robinson', 'Juan Manuel Restrepo'];

/* ---------------- Escena 1 · Portada y el caso ---------------- */

            { t: 'Carga sobre el origen', f: T`\text{misses}=1-\hat p`, s: T`1-${fmt(prop.phat)}=${fmt(1 - prop.phat)}\;\text{vs}\;0.15`, r: `Al origen llega ${pct((1 - prop.phat) / (1 - P0) - 1, 0)} más tráfico que lo pactado`, note: 'Comparación: (1 − p̂)/(1 − 0.85) − 1.' }
          ])}

/** Animación de la CDN conducida por la secuencia real de hits/misses. */
function cdnAnimation(canvas) {
  const ctx = canvas.getContext('2d');
  const seq = R.D.mode === 'requests' ? R.D.seq : (() => { let s = 7; return Array.from({ length: 400 }, () => { s = (s * 9301 + 49297) % 233280; return s / 233280 < R.prop.phat ? 1 : 0; }); })();
  let W, H, dpr;
  const resize = () => { dpr = window.devicePixelRatio || 1; W = canvas.clientWidth; H = 380; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  resize(); Life.on(window, 'resize', resize);
  const parts = []; let idx = 0, req = 0, hits = 0, load = 0, last = 0, hist = [];
  const users = [0.18, 0.34, 0.5, 0.66, 0.82];
  const pos = () => ({ ux: W * 0.08, ex: W * 0.46, ox: W * 0.86 });
  Life.raf(t => {
    const { ux, ex, ox } = pos();
    if (t - last > 95) {                      // nueva petición
      last = t;
      const y = users[Math.floor(Math.random() * users.length)] * (H - 90);
      parts.push({ x: ux, y, ty: (H - 90) * 0.5, v: seq[idx % seq.length], phase: 0 });
      idx++;
    }
    ctx.clearRect(0, 0, W, H);
    // Enlaces
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
    users.forEach(u => { ctx.beginPath(); ctx.moveTo(ux, u * (H - 90)); ctx.lineTo(ex, (H - 90) / 2); ctx.stroke(); });
    ctx.beginPath(); ctx.moveTo(ex, (H - 90) / 2); ctx.lineTo(ox, (H - 90) / 2); ctx.stroke();
    // Usuarios
    users.forEach(u => { ctx.fillStyle = '#334058'; ctx.beginPath(); ctx.arc(ux, u * (H - 90), 9, 0, 7); ctx.fill(); });
    ctx.fillStyle = '#93a0b4'; ctx.font = '600 13px Inter'; ctx.textAlign = 'center';
    ctx.fillText('Lectores', ux, H - 74);
    // Nodo CDN
    const cy = (H - 90) / 2;
    ctx.fillStyle = '#1a2232'; ctx.strokeStyle = '#ff7a1a'; ctx.lineWidth = 2;
    roundRect(ctx, ex - 52, cy - 46, 104, 92, 12); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff7a1a'; ctx.font = '800 14px Inter'; ctx.fillText('FASTLY', ex, cy - 8);
    ctx.fillStyle = '#93a0b4'; ctx.font = '500 12px Inter'; ctx.fillText('POP · caché', ex, cy + 12);
    // Servidor origen (tiembla con la carga)
    // Decaimiento proporcional: con 15 % de misses la carga se estabiliza ~0.5;
    // con más misses supera 0.55 y el origen entra en zona roja.
    load *= 0.992;
    const shake = load > .55 ? (Math.random() - .5) * 6 * load : 0;
    const hot = Math.min(1, load);
    ctx.fillStyle = `rgb(${26 + 200 * hot},${34 - 10 * hot},${50 - 20 * hot})`;
    ctx.strokeStyle = hot > .55 ? '#ff3d4a' : '#334058';
    roundRect(ctx, ox - 46 + shake, cy - 56, 92, 112, 10); ctx.fill(); ctx.stroke();
    for (let i = 0; i < 3; i++) { ctx.fillStyle = 'rgba(0,0,0,.35)'; roundRect(ctx, ox - 36 + shake, cy - 44 + i * 30, 72, 20, 4); ctx.fill(); ctx.fillStyle = hot > .55 && Math.random() > .5 ? '#ff3d4a' : '#2fe0a0'; ctx.beginPath(); ctx.arc(ox + 26 + shake, cy - 34 + i * 30, 3, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#e8edf4'; ctx.font = '700 13px Inter'; ctx.fillText('Origen NYT/Reddit', ox, cy + 76);
    if (hot > .7) { ctx.fillStyle = '#ff3d4a'; ctx.font = '800 16px JetBrains Mono'; ctx.fillText('503 · DB DOWN', ox, cy - 66); }
    // Barra de carga del origen
    ctx.fillStyle = '#1a2232'; roundRect(ctx, ox - 46, cy + 86, 92, 8, 4); ctx.fill();
    ctx.fillStyle = hot > .55 ? '#ff3d4a' : '#ffc247'; roundRect(ctx, ox - 46, cy + 86, 92 * hot, 8, 4); ctx.fill();
    // Partículas
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (p.phase === 0) {            // usuario → CDN
        p.x += (ex - ux) / 38; p.y += (p.ty - p.y) * 0.08;
        if (p.x >= ex - 4) {
          req++; if (p.v) hits++; p.phase = p.v ? 2 : 1;
          hist.push(hits / req); if (hist.length > 220) hist.shift();
        }
      } else if (p.phase === 1) {     // miss: CDN → origen
        p.x += (ox - ex) / 30;
        if (p.x >= ox - 40) { load = Math.min(1.2, load + 0.15); p.phase = 3; }
      } else {                         // regreso al usuario
        p.x -= (p.phase === 2 ? (ex - ux) / 26 : (ox - ux) / 50);
        if (p.x < ux) { parts.splice(i, 1); continue; }
      }
      ctx.fillStyle = p.v ? '#2fe0a0' : (p.phase === 3 ? '#ffc247' : '#ff3d4a');
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.v ? 4 : 5, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    }
    // Gráfico de la tasa acumulada con la línea de 85 %
    const gx = 16, gy = H - 58, gw = W - 32, gh = 48;
    ctx.fillStyle = 'rgba(255,255,255,.03)'; ctx.fillRect(gx, gy, gw, gh);
    const ys = v => gy + gh - (v - 0.5) / 0.5 * gh;
    ctx.strokeStyle = '#ff7a1a'; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(gx, ys(.85)); ctx.lineTo(gx + gw, ys(.85)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#ff7a1a'; ctx.font = '600 11px JetBrains Mono'; ctx.textAlign = 'left'; ctx.fillText('85 % contrato', gx + 4, ys(.85) - 4);
    ctx.strokeStyle = '#59c4ff'; ctx.lineWidth = 2; ctx.beginPath();
    hist.forEach((v, i) => { const X = gx + i / 220 * gw, Y = ys(Math.max(.5, v)); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke();
    ctx.textAlign = 'center';
    // Contadores
    const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
    set('cReq', int(req)); set('cHit', int(hits)); set('cMiss', int(req - hits));
    const rEl = document.getElementById('cRate');
    if (rEl && req) { rEl.textContent = pct(hits / req); rEl.className = 'v ' + (hits / req < P0 ? 'bad' : 'ok'); }
  });
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* ---------------- Escena 2 · Muestreo ---------------- */
SCENES.push({

        ? `<circle cx="${cx}" cy="${cy}" r="4.6" class="rv" style="--d:${(0.6 + j * 0.008).toFixed(3)}s" fill="${val ? '#2fe0a0' : '#ff3d4a'}"/>`
        : `<circle cx="${cx}" cy="${cy}" r="3" fill="#252e40"/>`;
    }
    const tipo = D.mode === 'requests'
      ? (D.groupCol ? `peticiones agrupadas por <b>${D.groupCol.name}</b> (muestreo por conglomerados)` : `<b>${int(prop.n)} peticiones consecutivas</b>${D.labelCol && D.labelCol.isId ? ` (${D.labelCol.name} ${D.labelCol.raw[0]} a ${D.labelCol.raw[D.labelCol.raw.length - 1]})` : ''}`)
      : `<b>${R.groups.length} intervalos/servidores</b>`;
    el.innerHTML = `
    <section class="scene">
      <div class="kicker">Escena 2 · Población, muestra y estimadores</div>
      <h1>De la población a la muestra</h1>

        <li><b>Población:</b> todas las peticiones que Fastly sirvió a NYT y Reddit tras el fallo (millones).</li>
        <li><b>Muestra:</b> ${tipo}.</li>

      </ul>
      <div class="grid2">

            <h3><span class="tag">POBLACIÓN</span> cada punto gris representa miles de peticiones</h3>

            <div class="muted small">Bloque resaltado = la muestra: <span class="ok">● hit</span> <span class="bad">● miss</span>${isReq ? '' : ' (verde: intervalo con tasa ≥ 85 %)'}.${nShow < (isReq ? D.seq.length : R.groups.length) ? ` Se dibujan las primeras ${nShow}.` : ''}</div>
          </div>
          <div class="card">
            <h3><span class="tag">TIPOS DE MUESTREO</span> ¿cuál aplica?</h3>
            <table class="small">
              <thead><tr><th>Tipo</th><th style="text-align:left">En este caso</th><th>¿Aplica?</th></tr></thead>
              <tbody>
                <tr><td>Aleatorio simple</td><td style="text-align:left;white-space:normal">Peticiones al azar de toda la hora</td><td class="am">ideal</td></tr>
                <tr><td>Sistemático</td><td style="text-align:left;white-space:normal">Bloque consecutivo de Request_ID</td><td class="hl"><b>✔ el usado</b></td></tr>
                <tr><td>Estratificado</td><td style="text-align:left;white-space:normal">Por región o por medio (NYT, Reddit)</td><td class="muted">recomendado</td></tr>
                <tr><td>Conglomerados</td><td style="text-align:left;white-space:normal">Lotes de peticiones consecutivas</td><td class="muted">tasa por lote</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="stack">

          <div class="card">

            <table>

              <tbody>
                <tr><td>${tex('p')} proporción real de hits</td><td>${tex(T`\bar p=\hat p`)}</td><td class="mono">${fmt(prop.phat)}</td></tr>

              <li>Cada petición: ${tex(T`X_i`)} = 1 (hit) o 0 (miss).</li>
              <li>Total de hits: ${tex(T`X\sim B(n,p)`)}</li>

            </ul>
          </div>
          <div class="card meaning"><h3>¿Qué significa?</h3><p>La muestra estima <b>p̄ = ${fmt(prop.phat)}</b>. ¿La diferencia con 0.85 es azar o una caída real?</p></div>
          ${how([
            { t: 'Proporción muestral', f: T`\bar p=\frac{x}{n}`, s: prop.hits !== null ? T`\bar p=\frac{${prop.hits}}{${prop.n}}` : '', r: `p̄ = ${fmt(prop.phat)}`, xl: '=' + R.E.phatExpr },
            { t: 'Media muestral de la tasa', f: T`\bar x=\frac{\sum x_i}{n}`, s: T`\bar x=\frac{${fmt(desc.sum)}}{${desc.m}}`, r: `x̄ = ${fmt(desc.mean)}`, xl: `=PROMEDIO(${R.E.rate})`, note: R.E.howRate },
            { t: 'Desviación estándar muestral', f: T`s=\sqrt{\frac{\sum (x_i-\bar x)^2}{n-1}}`, r: `s = ${fmt(desc.sd, 5)}`, xl: `=DESVEST.M(${R.E.rate})` },
            ...(binom ? [{ t: 'Media y desviación de la binomial bajo H₀', f: T`\mu=np_0,\quad \sigma=\sqrt{np_0(1-p_0)}`, s: T`\mu=${prop.n}(0.85)=${fmt(binom.mu, 2)},\quad\sigma=\sqrt{${prop.n}(0.85)(0.15)}=${fmt(binom.sigma, 4)}`, r: `μ = ${fmt(binom.mu, 2)}, σ = ${fmt(binom.sigma, 4)}`, xl: `=${prop.n}*0,85  ·  =RAIZ(${prop.n}*0,85*0,15)` }] : [])
          ])}

  }
});

/* ---------------- Escena 3 · Conjunto de datos ---------------- */

/* ---------------- Modelo de medidas (escenas 3 y 4) ----------------
   Valores, interpretación y procedimiento paso a paso de cada medida. */
function measureModel() {
  const { desc, E, x } = R;
    const u = R.D.mode === 'requests' ? 'lotes' : 'intervalos', u1 = u.slice(0, -1);
    const pts = v => (v * 100).toFixed(1) + ' pts';
    const below = desc.mean < P0 ? `<span class="bad">${pts(P0 - desc.mean)} bajo el 85 %</span>` : '<span class="ok">sobre el 85 %</span>';
    const cvTxt = desc.cv < 0.1 ? 'baja (&lt; 10 %): caída <b>sostenida</b>' : desc.cv < 0.3 ? 'moderada' : 'alta';
    // ---- Procedimientos paso a paso con los datos reales ----
    const n = desc.m, sx2 = Stats.sorted(x), f3 = v => fmt(v, 3);
    const freq = []; sx2.forEach(v => { const k = +v.toFixed(6), g = freq.find(q => q.v === k); g ? g.c++ : freq.push({ v: k, c: 1 }); });
    const few = freq.length <= 6;
    const ordTxt = few ? freq.map(q => `${f3(q.v)} (${q.c} ${q.c === 1 ? 'vez' : 'veces'})`).join(' · ') : sx2.map(f3).join(', ');
    const ordStep = { t: 'Ordenar los datos de menor a mayor', r: ordTxt, n: few ? `Posiciones: ${(() => { let a = 0; return freq.map(q => { const r = `x₍${a + 1}₎ a x₍${a + q.c}₎ = ${f3(q.v)}`; a += q.c; return r; }).join(' · '); })()}` : '' };
    const sumTex = few ? freq.map(q => `${f3(q.v)}\\times${q.c}`).join('+') : sx2.map(f3).join('+');
    const qSteps = (q, lab, xlf, plain) => {
      const L = (n - 1) * q + 1, i = Math.floor(L), d = L - i, xi = sx2[i - 1], xj = sx2[Math.min(i, n - 1)], v = xi + d * (xj - xi);
      return [ordStep,
        { t: 'Calcular la posición', f: T`L=(n-1)\,q+1=(${n}-1)(${q})+1=${L.toFixed(2)}`, n: `Cae entre la posición ${i} y la ${Math.min(i + 1, n)}.` },
        { t: 'Interpolar entre esos dos datos', f: T`${lab}=x_{(${i})}+${d.toFixed(2)}\,\big(x_{(${Math.min(i + 1, n)})}-x_{(${i})}\big)=${f3(xi)}+${d.toFixed(2)}(${f3(xj)}-${f3(xi)})=${fmt(v)}`, r: `${plain} = ${fmt(v)}`, xl: xlf }];
    };
    const SS = desc.var * (n - 1);
    const mid = n % 2 ? [(n + 1) / 2] : [n / 2, n / 2 + 1];
    const P = {
      'Media': [
        { t: 'Sumar todas las tasas', f: T`\sum x_i=${sumTex}=${fmt(desc.sum)}` },
        { t: 'Dividir entre el número de datos', f: T`\bar x=\frac{\sum x_i}{n}=\frac{${fmt(desc.sum)}}{${n}}=${fmt(desc.mean)}`, r: `x̄ = ${fmt(desc.mean)} = ${pct(desc.mean)}`, xl: `=PROMEDIO(${E.rate})` }],
      'Mediana': [ordStep,
        { t: `Ubicar el centro (n = ${n}, ${n % 2 ? 'impar' : 'par'})`, f: n % 2 ? T`\text{posición}=\frac{n+1}{2}=${mid[0]}` : T`\text{posiciones }\frac{n}{2}=${mid[0]}\text{ y }\frac{n}{2}+1=${mid[1]}` },
        { t: n % 2 ? 'Tomar ese dato' : 'Promediar los dos datos centrales', f: n % 2 ? T`Me=x_{(${mid[0]})}=${fmt(desc.median)}` : T`Me=\frac{x_{(${mid[0]})}+x_{(${mid[1]})}}{2}=\frac{${f3(sx2[mid[0] - 1])}+${f3(sx2[mid[1] - 1])}}{2}=${fmt(desc.median)}`, r: `Me = ${fmt(desc.median)}`, xl: `=MEDIANA(${E.rate})` }],
      'Moda': [
        { t: 'Contar cuántas veces aparece cada valor', r: few ? freq.map(q => `${f3(q.v)} → ${q.c}`).join(' · ') : `${desc.mode.distinct} valores distintos` },
        { t: 'Elegir el de mayor frecuencia', r: desc.mode.value !== null ? `Mo = ${fmt(desc.mode.value)} (${desc.mode.count} veces)` : 'Ningún valor se repite → no hay moda', xl: `=MODA.UNO(${E.rate})` }],
      'Q1': qSteps(0.25, 'Q_1', `=CUARTIL.INC(${E.rate};1)`, 'Q1'),
      'Q3': qSteps(0.75, 'Q_3', `=CUARTIL.INC(${E.rate};3)`, 'Q3'),
      'Percentil 95': qSteps(0.95, 'P_{95}', `=PERCENTIL.INC(${E.rate};0,95)`, 'P95'),
      'Percentil 99': qSteps(0.99, 'P_{99}', `=PERCENTIL.INC(${E.rate};0,99)`, 'P99'),
      'Mín · Máx': [ordStep,
        { t: 'Tomar el primero y el último', f: T`x_{min}=x_{(1)}=${f3(desc.min)},\qquad x_{max}=x_{(${n})}=${f3(desc.max)}`, xl: `=MIN(${E.rate})  ·  =MAX(${E.rate})` }],
      'Rango': [
        { t: 'Restar mínimo al máximo', f: T`R=x_{max}-x_{min}=${f3(desc.max)}-${f3(desc.min)}=${fmt(desc.range)}`, r: `R = ${fmt(desc.range)} = ${pts(desc.range)}`, xl: `=MAX(${E.rate})-MIN(${E.rate})` }],
      'Rango intercuartílico': [
        { t: 'Calcular Q1 y Q3', r: `Q1 = ${fmt(desc.q1)} · Q3 = ${fmt(desc.q3)}`, n: 'Q1 y Q3 se calculan en la escena 3 (Datos).' },
        { t: 'Restar', f: T`RIC=Q_3-Q_1=${fmt(desc.q3)}-${fmt(desc.q1)}=${fmt(desc.iqr)}`, xl: `=CUARTIL.INC(${E.rate};3)-CUARTIL.INC(${E.rate};1)` }],
      'Varianza': [
        { t: 'Restar la media a cada dato y elevar al cuadrado', f: few ? T`\sum(x_i-\bar x)^2=${freq.map(q => `(${f3(q.v)}-${fmt(desc.mean)})^2\\times${q.c}`).join('+')}` : T`\sum(x_i-\bar x)^2`, r: `Σ(xᵢ − x̄)² = ${fmt(SS, 6)}` },
        { t: 'Dividir entre n − 1 (varianza muestral)', f: T`s^2=\frac{\sum(x_i-\bar x)^2}{n-1}=\frac{${fmt(SS, 6)}}{${n - 1}}=${fmt(desc.var, 6)}`, r: `s² = ${fmt(desc.var, 6)}`, xl: `=VAR.S(${E.rate})` }],
      'Desv. estándar': [
        { t: 'Partir de la varianza', r: `s² = ${fmt(desc.var, 6)}` },
        { t: 'Sacar raíz cuadrada', f: T`s=\sqrt{s^2}=\sqrt{${fmt(desc.var, 6)}}=${fmt(desc.sd, 4)}`, r: `s = ${fmt(desc.sd, 4)} → ± ${pts(desc.sd)}`, xl: `=DESVEST.M(${E.rate})` }],
      'Coef. variación': [
        { t: 'Dividir la desviación entre la media', f: T`CV=\frac{s}{\bar x}\times100\%=\frac{${fmt(desc.sd, 4)}}{${fmt(desc.mean, 4)}}\times100\%=${(desc.cv * 100).toFixed(2)}\%`, xl: `=DESVEST.M(${E.rate})/PROMEDIO(${E.rate})` },
        { t: 'Interpretar', r: `${pct(desc.cv, 1)} → variación ${desc.cv < 0.1 ? 'baja' : desc.cv < 0.3 ? 'moderada' : 'alta'}`, n: 'Referencia: CV < 10 % baja · 10–30 % moderada · > 30 % alta.' }]
    };
    // [grupo, medida, símbolo, valor, qué representa, cómo se lee en el caso]
    const rows = [
      ['Tendencia central', 'Media', T`\bar x`, desc.mean, 'Promedio de todas las tasas', `Tasa típica ${pct(desc.mean)}: ${below}`],
      [null, 'Mediana', T`Me`, desc.median, 'Valor del centro: deja 50 % a cada lado', `La mitad de los ${u} tuvo ≤ ${pct(desc.median)}`],
      [null, 'Moda', T`Mo`, desc.mode.value, 'Valor que más se repite', desc.mode.value !== null ? `${pct(desc.mode.value)} aparece ${desc.mode.count} de ${desc.m} veces` : 'Ningún valor se repite'],
      ['Dispersión', 'Mín · Máx', T`x_{min}\cdot x_{max}`, null, 'Peor y mejor dato', `Peor ${u1}: ${pct(desc.min)} · mejor: ${pct(desc.max)}`],
      [null, 'Rango', T`R`, desc.range, 'Máx − Mín: amplitud total', `${pts(desc.range)} entre el peor y el mejor ${u1}`],
      [null, 'Rango intercuartílico', T`RIC`, desc.iqr, 'Q3 − Q1: amplitud del 50 % central', desc.iqr === 0 ? 'El 50 % central tiene el mismo valor' : `El 50 % central varía ${pts(desc.iqr)}`],
      [null, 'Varianza', T`s^2`, desc.var, 'Promedio de desvíos al cuadrado', 'Unidades al cuadrado: se interpreta con s'],
      [null, 'Desv. estándar', T`s`, desc.sd, 'Distancia típica de un dato a la media', `Cada ${u1} se aleja ± ${pts(desc.sd)} de la media`],
      [null, 'Coef. variación', T`CV`, desc.cv, 's / x̄: dispersión relativa', `${pct(desc.cv, 1)} → variación ${cvTxt}`]
    ];
    const pos = [
      ['Medidas de posición', 'Q1', T`Q_1`, desc.q1, '25 % de los datos queda por debajo', `El 25 % peor de los ${u} tuvo ≤ ${pct(desc.q1)}`],
      [null, 'Q3', T`Q_3`, desc.q3, '75 % de los datos queda por debajo', `El 75 % de los ${u} tuvo ≤ ${pct(desc.q3)}`],
      [null, 'Percentil 95', T`P_{95}`, desc.p95, '95 % de los datos queda por debajo', `95 % de los ${u} ≤ ${pct(desc.p95)}${desc.p95 < P0 ? ' → <span class="bad">no llega al 85 %</span>' : ''}`],
      [null, 'Percentil 99', T`P_{99}`, desc.p99, '99 % de los datos queda por debajo', `Casi todos los ${u} ≤ ${pct(desc.p99)}${desc.p99 < P0 ? ' → <span class="bad">ni el mejor tramo cumple</span>' : ''}`],
    ];
    const val = (n, v) => n === 'Mín · Máx' ? `${fmt(desc.min, 3)} · ${fmt(desc.max, 3)}` : v === null ? '#N/A' : n === 'Coef. variación' ? pct(v, 2) : fmt(v, n === 'Varianza' ? 6 : 4);
  return { rows, pos, P, val, u, u1, pts, cvTxt };
}
/** Tabla de medidas con botón "Paso a paso" por fila. */
function measureTable(rows, P, val, pref) {
  return `<div class="tbl-wrap" style="max-height:none"><table class="mtc">
    <thead><tr><th>Medida</th><th>Valor</th><th style="text-align:left">¿Qué representa?</th><th style="text-align:left">¿Cómo se lee aquí?</th></tr></thead>
    <tbody>${rows.map(([g, nm, s, v, what, read], i) => `${g ? `<tr><td colspan="4" style="background:#141b27;color:var(--orange);font:700 12px var(--mono);letter-spacing:.12em;text-transform:uppercase">${g}</td></tr>` : ''}<tr class="rv" style="--d:${(0.1 + i * 0.05).toFixed(2)}s"><td><b>${nm}</b><br>${tex(s)}${P[nm] ? procBtn(pref + i) : ''}</td><td class="mono">${val(nm, v)}</td><td class="what">${what}</td><td class="read">${read}</td></tr>${P[nm] ? `<tr class="proc" id="${pref}${i}"><td colspan="4">${procHTML(P[nm])}</td></tr>` : ''}`).join('')}</tbody>
  </table></div>`;
}

/* ---------------- Escena 4 · MTC y dispersión ---------------- */
SCENES.push({
  title: 'MTC',
  render(el) {
    const { desc, E, x, norm } = R;
    // Recta numérica: puntos apilados (dot plot) y marcadores
    const W = 760, H = 360, pad = 50;
    // El eje incluye el 0.85 del contrato si está razonablemente cerca de los datos
    let lo = Math.min(desc.min, desc.mean - desc.sd), hi = Math.max(desc.max, desc.mean + desc.sd);
    if (P0 > hi && P0 - hi < 3 * ((hi - lo) || 0.05)) hi = P0;
    if (P0 < lo && lo - P0 < 3 * ((hi - lo) || 0.05)) lo = P0;
    const span = (hi - lo) || 1, a = lo - span * 0.08, b = hi + span * 0.08;
    const sx = v => pad + (v - a) / (b - a) * (W - 2 * pad);
    const base = 200;
    // Dot plot: el radio se ajusta para que la pila más alta quepa en 130 px
    const r0 = Math.max(2.5, Math.min(7, 260 / Math.max(10, x.length)));
    const keyOf = (v, rr) => Math.round(sx(v) / (rr * 2.1));
    const tallest = rr => { const c = new Map(); x.forEach(v => c.set(keyOf(v, rr), (c.get(keyOf(v, rr)) || 0) + 1)); return Math.max(...c.values()); };
    let r = r0; while (r > 1.5 && tallest(r) * r * 2.1 > 130) r -= 0.25;
    const stackCount = new Map(); let dots = '';
    Stats.sorted(x).forEach((v, i) => {
      const key = keyOf(v, r);
      const c = stackCount.get(key) || 0; stackCount.set(key, c + 1);
      dots += `<circle class="rv" style="--d:${(Math.min(i, 60) * 0.035).toFixed(2)}s" cx="${sx(v)}" cy="${base - r - 2 - c * r * 2.1}" r="${r}" fill="#59c4ff" opacity=".85"/>`;
    });
    const t0 = Math.min(x.length, 60) * 0.035 + 0.3;
    const raw = [
      ['Mín', desc.min], ['Mediana', desc.median], ['Moda', desc.mode.value],
      ['Media x̄', desc.mean], ['Máx', desc.max]
    ].filter(m => m[1] !== null);
    // Medidas con el mismo valor se agrupan en una sola etiqueta (p. ej. "Mediana = Q3 = Máx")
    const marks = [];
    raw.forEach(([lab, v]) => { const g = marks.find(m => Math.abs(sx(m.v) - sx(v)) < 2); g ? g.labs.push(lab) : marks.push({ v, labs: [lab] }); });
    marks.sort((p, q) => p.v - q.v);
    let mk = '';
    marks.forEach((m, i) => {
      const isMean = m.labs.includes('Media x̄'), col = isMean ? '#ff7a1a' : m.labs.includes('Mediana') ? '#2fe0a0' : m.labs.includes('Moda') ? '#ffc247' : '#a98bff';
      const lvl = i % 3, y2 = base + 28 + lvl * 30;
      const anchor = sx(m.v) < 140 ? 'start' : sx(m.v) > W - 140 ? 'end' : 'middle';
      // Etiquetas largas (varias medidas iguales) se parten en líneas de 3
      const lines = []; for (let j = 0; j < m.labs.length; j += 3) lines.push(m.labs.slice(j, j + 3).join(' = '));
      lines[lines.length - 1] += ` ${fmt(m.v, 3)}`;
      mk += `<g class="rv" style="--d:${(t0 + i * 0.5).toFixed(2)}s"><line x1="${sx(m.v)}" x2="${sx(m.v)}" y1="${base - 4}" y2="${y2 - 14}" stroke="${col}" stroke-width="2"/>
        <text x="${sx(m.v)}" y="${y2}" fill="${col}" font-size="14" font-weight="700" text-anchor="${anchor}">${lines.map((l, j) => `<tspan x="${sx(m.v)}" dy="${j ? 17 : 0}">${l}${j < lines.length - 1 ? ' =' : ''}</tspan>`).join('')}</text></g>`;
    });
    const tS = t0 + marks.length * 0.5 + 0.2;
    const band = `<g class="rv" style="--d:${tS}s"><rect x="${sx(desc.mean - desc.sd)}" y="${base - 150}" width="${sx(desc.mean + desc.sd) - sx(desc.mean - desc.sd)}" height="150" fill="#ff7a1a" opacity=".08"/>
      <line x1="${sx(desc.mean - desc.sd)}" x2="${sx(desc.mean + desc.sd)}" y1="${base - 156}" y2="${base - 156}" stroke="#ff7a1a" stroke-width="2"/>

              <div><div class="q">¿Cuánto varía?</div><div class="a">s = <b>${fmt(desc.sd, 4)}</b> (± ${pts(desc.sd)}) · CV = <b>${pct(desc.cv, 1)}</b> → variación ${cvTxt}.</div></div>
              <div><div class="q">¿Media, mediana y moda coinciden?</div><div class="a">${Math.abs(desc.mean - desc.median) < 0.25 * desc.sd ? 'Sí: indicio de simetría.' : `No (${fmt(desc.mean, 3)} vs ${fmt(desc.median, 3)}): media &lt; mediana → <b>asimetría negativa</b>. Se analiza en la escena 6.`}</div></div>
            </div>
          </div>

            { t: 'Media', f: T`\bar x=\frac{\sum x_i}{n}`, s: T`\bar x=\frac{${fmt(desc.sum)}}{${desc.m}}`, r: `x̄ = ${fmt(desc.mean)}`, xl: `=PROMEDIO(${E.rate})` },
            { t: 'Mediana', f: T`Me = x_{\left(\frac{n+1}{2}\right)}`, s: T`\text{posición}=\frac{${desc.m}+1}{2}=${(desc.m + 1) / 2}`, r: `Me = ${fmt(desc.median)}`, xl: `=MEDIANA(${E.rate})` },
            { t: 'Varianza muestral (n − 1)', f: T`s^2=\frac{\sum (x_i-\bar x)^2}{n-1}`, s: T`s^2=\frac{${fmt(desc.var * (desc.m - 1), 6)}}{${desc.m - 1}}`, r: `s² = ${fmt(desc.var, 6)}`, xl: `=VAR.S(${E.rate})` },
            { t: 'Desviación estándar', f: T`s=\sqrt{s^2}`, s: T`s=\sqrt{${fmt(desc.var, 6)}}`, r: `s = ${fmt(desc.sd, 5)}`, xl: `=DESVEST.M(${E.rate})` },
            { t: 'Coeficiente de variación', f: T`CV=\frac{s}{\bar x}\times100\%`, s: T`CV=\frac{${fmt(desc.sd, 5)}}{${fmt(desc.mean, 4)}}\times100\%`, r: `CV = ${pct(desc.cv, 2)}` },
            { t: 'Cuartiles (método inclusivo)', f: T`L_q=(n-1)\,q+1`, s: T`L_{0.25}=${((desc.m - 1) * .25 + 1).toFixed(2)},\;L_{0.75}=${((desc.m - 1) * .75 + 1).toFixed(2)}`, r: `Q1 = ${fmt(desc.q1)} · Q3 = ${fmt(desc.q3)} · RIC = ${fmt(desc.iqr)}`, xl: `=CUARTIL.INC(${E.rate};1)`, note: E.howRate },

  }
});

            : `<b>NO RECHAZAR H₀.</b> No hay evidencia suficiente de que la tasa cayera por debajo del 85 %. Se <b>absuelve a Fastly</b>; el colapso se atribuye a la configuración de los balanceadores de los propios medios.`}</div>
          <div class="sub" style="margin:14px 0 0;font-size:.9em">Peritos: ${TEAM.join(' · ')}</div>
          <div class="stamp-row"><div class="stamp ${rj ? 'red' : 'green'}">${rj ? 'FASTLY<br>RESPONSABLE' : 'FASTLY<br>ABSUELTO'}<small>α = 0.05 · p = ${fmtP(test.pval)}</small></div></div>
        </div>
        <div class="stack">
          <div class="card"><h3><span class="tag">ERRORES</span> ¿Y si el tribunal se equivoca?</h3>
            <table class="decision-tbl small">
              <thead><tr><th></th><th>Realidad: H₀ cierta<br><span class="muted">(Fastly cumplió)</span></th><th>Realidad: H₀ falsa<br><span class="muted">(Fastly falló)</span></th></tr></thead>
              <tbody>
                <tr><td><b>Rechazar H₀</b><br><span class="muted">culpar a Fastly</span></td><td class="bad"><b>Error tipo I</b><br>P = α</td><td class="ok">Decisión correcta</td></tr>
                <tr><td><b>No rechazar H₀</b><br><span class="muted">absolver a Fastly</span></td><td class="ok">Decisión correcta</td><td class="am"><b>Error tipo II</b><br>P = β</td></tr>
              </tbody>
            </table>
          </div>
          <div class="err-grid">
            <div class="err" style="border-color:rgba(255,61,74,.5)"><h3 class="bad">Error tipo I (α)</h3>
              <ul class="keys small">
                <li><b>Culpar a Fastly</b> cuando sí cumplió.</li>
                <li>Perjudica a Fastly: paga costos injustos.</li>
                <li>Se controla con α = 0.05.</li>
              </ul>
            </div>
            <div class="err" style="border-color:rgba(255,194,71,.5)"><h3 class="am">Error tipo II (β)</h3>
              <ul class="keys small">
                <li><b>Absolver a Fastly</b> cuando sí falló.</li>
                <li>Perjudica a NYT/Reddit: asumen los costos.</li>
                <li>Más probable con muestras pequeñas.</li>
              </ul>
            </div>
          </div>
          <div class="card small">Bajar α (0.05 → 0.01) reduce el error tipo I pero aumenta el tipo II.</div>
          <div class="card meaning"><h3>¿Qué significa?</h3><p>${rj
            ? `Se rechazó H₀ → el único error posible es el <b>tipo I</b>, con probabilidad ≤ 0.05. Con un valor p de ${fmtP(test.pval)}, ese riesgo es mínimo.`
            : `No se rechazó H₀ → el único error posible es el <b>tipo II</b>.`}</p></div>
          ${how([
            { t: 'Probabilidad de error tipo I', f: T`P(\text{error tipo I})=\alpha`, r: 'α = 0.05 (principal) · α = 0.01 (comparación)' },
            { t: 'Decisión', f: T`\text{Rechazar }H_0\iff z\le z_\alpha\iff \text{valor }p<\alpha`, s: T`${fmt(test.z, 4)}\le-1.645,\qquad ${texP(test.pval)}<0.05`, r: rj ? 'Se rechaza H₀ → el único error posible es el tipo I' : 'No se rechaza H₀ → el único error posible es el tipo II', xl: `=DISTR.NORM.ESTAND.N(${xl(test.z)};VERDADERO)<0,05` }
          ])}
        </div>
      </div>
    </section>`;
  }
});

/* =====================================================================
   6. NAVEGACIÓN, CARGA DE ARCHIVOS Y ARRANQUE
   ===================================================================== */
let current = 0;
function renderScene(i, keepScroll = false) {
  current = Math.max(0, Math.min(SCENES.length - 1, i));
  Life.clear();
  const stage = $('#stage');
  const y = stage.scrollTop;
  try { SCENES[current].render(stage); }
  catch (e) { console.error(e); stage.innerHTML = `<div class="card warn"><h3>Error al dibujar la escena</h3><p class="mono small">${e.message}</p></div>`; }
  stage.scrollTop = keepScroll ? y : 0;
  $('#progBar').style.width = ((current + 1) / SCENES.length * 100) + '%';
  $('#where').innerHTML = `<b>${current + 1} / ${SCENES.length}</b> · ${SCENES[current].title} <span class="kbdh">&nbsp; <span class="kbd">←</span> <span class="kbd">→</span></span>`;
  $('#btnPrev').disabled = current === 0;
  $('#btnNext').disabled = current === SCENES.length - 1;
  document.querySelectorAll('.dot').forEach((d, j) => { d.classList.toggle('on', j === current); d.classList.toggle('done', j < current); });
  document.querySelector('.dot.on')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  try { history.replaceState(null, '', '#' + (current + 1)); } catch (e) { /* el visor puede bloquearlo */ }
}
function recompute() {
  R = compute(DATA);
  const D = DATA;
  $('#dsBadge').textContent = `${D.file} · n = ${int(R.prop.n)} · p̂ = ${fmt(R.prop.phat)}`;
  renderScene(current, true);
}
// Puntos de navegación
$('#dots').innerHTML = SCENES.map((s, i) => `<button class="dot" data-i="${i}">${i + 1}. ${s.title}</button>`).join('');
$('#dots').addEventListener('click', e => { const d = e.target.closest('.dot'); if (d) renderScene(+d.dataset.i); });
$('#btnPrev').onclick = () => renderScene(current - 1);
$('#btnNext').onclick = () => renderScene(current + 1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input,select,textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); renderScene(current + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); renderScene(current - 1); }
});
// Arranque
(function start() {
  if (typeof Chart === 'undefined' || typeof katex === 'undefined') {
    $('#stage').innerHTML = '<div class="card warn"><h3>No se cargaron las librerías</h3><p>Este programa necesita conexión a internet para descargar Chart.js y KaTeX desde la CDN. Conéctate y recarga la página.</p></div>';
    return;
  }
  DATA = embeddedDataset();
  R = compute(DATA);
  $('#dsBadge').textContent = `${DATA.file} · n = ${int(R.prop.n)} · p̂ = ${fmt(R.prop.phat)}`;
  const h = parseInt(location.hash.slice(1), 10);
  renderScene(Number.isFinite(h) ? h - 1 : 0);
})();
</script>
